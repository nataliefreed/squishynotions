<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Image Collage Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: toolbar across the top, a light gray workspace in the middle with the letter sheet centered on it,
     key hints along the bottom. */
  :root {
    --mat: #dcdfe3;
    --chrome: #f7f7f8;
    --chrome-line: #d4d7db;
    --btn: #ffffff;
    --btn-hover: #eceef0;
    --fg: #1b1e22;
    --fg-muted: #586069;
    --accent: #1a5fd1;
    --accent-hover: #1450b3;
    --accent-fg: #ffffff;
    /* the sheet of paper is white in every theme */
    --paper-ink: #1d2125;
    --paper-muted: #67707a;
    --paper-line: #c8ccd2;
    --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --font-ui: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --mat: #202327;
      --chrome: #181a1d;
      --chrome-line: #32363b;
      --btn: #25282c;
      --btn-hover: #2f3338;
      --fg: #e8eaed;
      --fg-muted: #9fa6ae;
      --accent: #5b9bff;
      --accent-hover: #7db0ff;
      --accent-fg: #08162e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --mat: #202327;
    --chrome: #181a1d;
    --chrome-line: #32363b;
    --btn: #25282c;
    --btn-hover: #2f3338;
    --fg: #e8eaed;
    --fg-muted: #9fa6ae;
    --accent: #5b9bff;
    --accent-hover: #7db0ff;
    --accent-fg: #08162e;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--chrome);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.4;
    -webkit-user-select: none;
    user-select: none;
  }

  /* toolbar */
  .bar {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
    background: var(--chrome);
    border-bottom: 1px solid var(--chrome-line);
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.01em;
    margin-right: 6px;
  }
  .group { display: flex; gap: 6px; }
  .spacer { flex: 1 1 0; min-width: 0; }
  .spec {
    color: var(--fg-muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 38px;
    padding: 0 13px;
    border: 1px solid var(--chrome-line);
    border-radius: 6px;
    background: var(--btn);
    color: var(--fg);
    font: 500 14px var(--font-ui);
    cursor: pointer;
    transition: background-color 0.12s;
  }
  .btn:hover:not(:disabled) { background: var(--btn-hover); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:focus-visible, .empty:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn.icon { width: 38px; padding: 0; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn.primary svg { width: 20px; height: 20px; stroke-width: 2.6; }

  /* workspace */
  .stage { position: relative; flex: 1 1 auto; min-height: 300px; overflow: hidden; }
  .stage.dragging { box-shadow: inset 0 0 0 3px var(--accent); }
  .mat {
    position: absolute;
    inset: 0;
    background-color: var(--mat);
  }
  .host {
    position: absolute;
    inset: 0;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  }
  .box { position: relative; width: 100%; height: 100%; }
  .box canvas { display: block; position: absolute; left: 0; top: 0; z-index: 1; touch-action: none; }

  .page-overlay {
    position: absolute;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .empty {
    pointer-events: auto;
    appearance: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 280px;
    max-width: 84%;
    padding: 26px 18px;
    border: 2px dashed var(--paper-line);
    border-radius: 10px;
    background: transparent;
    color: var(--paper-ink);
    font-family: var(--font-ui);
    text-align: center;
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
  }
  .empty:hover { border-color: var(--accent); }
  .empty-plus {
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-fg);
  }
  .empty-plus svg { width: 26px; height: 26px; stroke-width: 2.6; }
  .empty-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; margin-top: 6px; }
  .empty-sub { font-size: 13px; color: var(--paper-muted); }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translate(-50%, 8px);
    z-index: 3;
    max-width: calc(100% - 32px);
    padding: 9px 14px;
    border-radius: 6px;
    background: var(--fg);
    color: var(--chrome);
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* key hints */
  .foot {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 18px;
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
    background: var(--chrome);
    border-top: 1px solid var(--chrome-line);
    color: var(--fg-muted);
    font-size: 12px;
  }
  kbd {
    display: inline-block;
    min-width: 1.5em;
    margin-right: 2px;
    padding: 0 5px;
    border: 1px solid var(--chrome-line);
    border-bottom-width: 2px;
    border-radius: 4px;
    background: var(--btn);
    color: var(--fg);
    font: 500 11px var(--font-ui);
    text-align: center;
  }

  @media (max-width: 760px) { .spec { display: none; } }
  @media (max-width: 520px) { .brand { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    .btn, .empty, .toast { transition: none; }
  }
</style>

<header class="bar">
  <span class="brand">Collage</span>
  <div class="group">
    <button id="addBtn" class="btn primary" type="button" aria-label="Add image" title="Add images">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add image</span>
    </button>
  </div>
  <div class="group" role="group" aria-label="Edit">
    <button id="undoBtn" class="btn icon" type="button" aria-label="Undo" title="Undo" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="redoBtn" class="btn icon" type="button" aria-label="Redo" title="Redo" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button id="delBtn" class="btn icon" type="button" aria-label="Delete selected image" title="Delete selected image (Delete key)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg>
    </button>
  </div>
  <div class="spacer"></div>
  <span class="spec">Letter, 8.5 × 11 in · exports 2550 × 3300 px</span>
  <button id="dlBtn" class="btn" type="button" aria-label="Download PNG" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
    <span id="dlLabel">Download PNG</span>
  </button>
</header>

<input id="fileInput" type="file" accept="image/*" multiple hidden>

<main class="stage" id="stage">
  <div class="mat" aria-hidden="true"></div>
  <div class="host">
    <div class="box" id="box">
      <div class="page-overlay" id="pageOverlay">
        <button id="emptyAdd" class="empty" type="button">
          <span class="empty-plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>

</main>

<footer class="foot">
  <span>Drag an image to move it</span>
  <span>Square corners resize</span>
  <span>Round handle rotates, <kbd>Shift</kbd> snaps to 15°</span>
  <span><kbd>Delete</kbd> removes</span>
  <span><kbd class="mod">Ctrl</kbd><kbd>Z</kbd> undo, <kbd class="mod">Ctrl</kbd><kbd>Shift</kbd><kbd>Z</kbd> redo</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
(() => {
  'use strict';

  // ---- constants -------------------------------------------------------
  const PAGE_W = 850, PAGE_H = 1100;      // US Letter at 100 units per inch
  const EXPORT_SCALE = 3;                 // 2550 x 3300 px, 300 dpi
  const MAX_IMG_DIM = 2400;               // longest side kept in memory per photo
  const INSERT_MAX = 440;                 // starting size of a new photo, in page units
  const MIN_SIZE = 24, MAX_SIZE = 3200;
  const HISTORY_LIMIT = 200;
  const SNAP = Math.PI / 12;              // 15 degrees
  const CORNERS = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  const coarse = window.matchMedia('(pointer: coarse)').matches;
  const HANDLE = coarse ? 18 : 11;        // handle sizes and hit radii are in screen px
  const HIT = coarse ? 24 : 14;
  const ROT_OFFSET = coarse ? 38 : 30;

  // ---- state -----------------------------------------------------------
  let items = [];                         // bottom to top: {id, img, x, y, w, h, rot}
  let selectedId = null;
  let nextId = 1;
  let undoStack = [], redoStack = [];
  let gesture = null;
  let view = { s: 1, ox: 0, oy: 0, w: 1, h: 1 };
  let sketch = null, canvasEl = null, ready = false, raf = 0, exporting = false;

  const $ = (id) => document.getElementById(id);
  const els = {
    stage: $('stage'), box: $('box'), overlay: $('pageOverlay'), file: $('fileInput'),
    add: $('addBtn'), emptyAdd: $('emptyAdd'), undo: $('undoBtn'), redo: $('redoBtn'),
    del: $('delBtn'), dl: $('dlBtn'), dlLabel: $('dlLabel'), toast: $('toast')
  };

  const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
  const modName = isMac ? '⌘' : 'Ctrl';
  document.querySelectorAll('.mod').forEach((k) => { k.textContent = modName; });
  els.undo.title = 'Undo (' + modName + '+Z)';
  els.redo.title = 'Redo (' + modName + '+Shift+Z)';

  // ---- helpers ---------------------------------------------------------
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const byId = (id) => items.find((it) => it.id === id) || null;
  const getSelected = () => byId(selectedId);
  const place = (cx, cy, rot, lx, ly) => {
    const c = Math.cos(rot), s = Math.sin(rot);
    return { x: cx + lx * c - ly * s, y: cy + lx * s + ly * c };
  };
  const toWorld = (it, lx, ly) => place(it.x, it.y, it.rot, lx, ly);
  const toLocal = (it, wx, wy) => {
    const dx = wx - it.x, dy = wy - it.y, c = Math.cos(it.rot), s = Math.sin(it.rot);
    return { x: dx * c + dy * s, y: -dx * s + dy * c };
  };
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const wrapAngle = (a) => ((a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#1a5fd1';

  let toastTimer = 0;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 3200);
  }

  function invalidate() {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; if (ready) sketch.redraw(); });
  }

  function updateUI() {
    els.undo.disabled = !undoStack.length;
    els.redo.disabled = !redoStack.length;
    els.del.disabled = !selectedId;
    els.dl.disabled = !items.length || exporting;
    els.overlay.hidden = items.length > 0;
  }

  // ---- history ---------------------------------------------------------
  const copyItem = ({ id, img, x, y, w, h, rot }) => ({ id, img, x, y, w, h, rot });
  const snapshot = () => items.map(copyItem);
  function sameState(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      const p = a[i], q = b[i];
      if (p.id !== q.id || p.x !== q.x || p.y !== q.y || p.w !== q.w || p.h !== q.h || p.rot !== q.rot) return false;
    }
    return true;
  }
  function pushHistory(before) {
    undoStack.push(before);
    if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack = [];
    updateUI();
  }
  function restore(state) {
    items = state.map(copyItem);
    if (selectedId && !byId(selectedId)) selectedId = null;
    updateUI();
    invalidate();
  }
  function undo() {
    if (gesture || !undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
  }
  function redo() {
    if (gesture || !redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
  }

  // ---- editing ---------------------------------------------------------
  function deleteSelected() {
    if (!selectedId || gesture) return;
    const before = snapshot();
    items = items.filter((it) => it.id !== selectedId);
    selectedId = null;
    pushHistory(before);
    invalidate();
  }

  function raise(it) {
    const i = items.indexOf(it);
    if (i >= 0 && i < items.length - 1) { items.splice(i, 1); items.push(it); }
  }

  function loadPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const el = new Image();
      el.onload = () => {
        try {
          const nw = el.naturalWidth, nh = el.naturalHeight;
          if (!nw || !nh) throw new Error('empty image');
          const k = Math.min(1, MAX_IMG_DIM / Math.max(nw, nh));
          const w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
          const img = sketch.createImage(w, h);
          img.drawingContext.imageSmoothingQuality = 'high';
          img.drawingContext.drawImage(el, 0, 0, w, h);
          resolve({ img, w, h });
        } catch (err) {
          reject(err);
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      el.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
      el.src = url;
    });
  }

  function makeItem(photo, n) {
    const k = Math.min(INSERT_MAX / photo.w, INSERT_MAX / photo.h);
    const off = ((n % 5) - 2) * 34;
    return { id: nextId++, img: photo.img, x: PAGE_W / 2 + off, y: PAGE_H / 2 + off, w: photo.w * k, h: photo.h * k, rot: 0 };
  }

  async function addFiles(fileList) {
    const files = Array.from(fileList || []).filter((f) => f.type && f.type.startsWith('image/'));
    if (!files.length) { toast('Choose an image file such as JPG, PNG or WebP.'); return; }
    const photos = [];
    let failed = 0;
    for (const f of files) {
      try { photos.push(await loadPhoto(f)); } catch (e) { failed++; }
    }
    if (!photos.length) { toast("That image couldn't be opened. Try a JPG or PNG."); return; }
    const before = snapshot();
    photos.forEach((p) => items.push(makeItem(p, items.length)));
    selectedId = items[items.length - 1].id;
    pushHistory(before);
    if (failed) toast(failed + (failed > 1 ? ' files' : ' file') + " couldn't be opened.");
    invalidate();
  }

  // ---- hit testing -----------------------------------------------------
  function pagePoint(e) {
    const r = canvasEl.getBoundingClientRect();
    return { x: (e.clientX - r.left - view.ox) / view.s, y: (e.clientY - r.top - view.oy) / view.s };
  }
  function hitItem(pt) {
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i], l = toLocal(it, pt.x, pt.y);
      if (Math.abs(l.x) <= it.w / 2 && Math.abs(l.y) <= it.h / 2) return it;
    }
    return null;
  }
  function hitHandle(it, pt) {
    const inv = 1 / view.s, r = HIT * inv;
    if (dist(toWorld(it, 0, -it.h / 2 - ROT_OFFSET * inv), pt) <= r) return { type: 'rotate' };
    for (let i = 0; i < 4; i++) {
      const c = toWorld(it, CORNERS[i][0] * it.w / 2, CORNERS[i][1] * it.h / 2);
      if (dist(c, pt) <= r) return { type: 'resize', corner: i };
    }
    return null;
  }
  function resizeCursor(it, corner) {
    const a = Math.atan2(CORNERS[corner][1] * it.h / 2, CORNERS[corner][0] * it.w / 2) + it.rot;
    const d = ((a * 180 / Math.PI) % 180 + 180) % 180;
    if (d < 22.5 || d >= 157.5) return 'ew-resize';
    if (d < 67.5) return 'nwse-resize';
    if (d < 112.5) return 'ns-resize';
    return 'nesw-resize';
  }
  function hoverCursor(pt) {
    const sel = getSelected(), h = sel && hitHandle(sel, pt);
    if (h && h.type === 'rotate') return 'grab';
    if (h && h.type === 'resize') return resizeCursor(sel, h.corner);
    return hitItem(pt) ? 'move' : 'default';
  }

  // ---- pointer gestures ------------------------------------------------
  function onPointerDown(e) {
    if (gesture) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    const pt = pagePoint(e), before = snapshot(), sel = getSelected();
    const h = sel && hitHandle(sel, pt);
    let g;
    if (h && h.type === 'rotate') {
      g = { type: 'rotate', id: sel.id, startAngle: Math.atan2(pt.y - sel.y, pt.x - sel.x), startRot: sel.rot };
      canvasEl.style.cursor = 'grabbing';
    } else if (h && h.type === 'resize') {
      const sx = CORNERS[h.corner][0], sy = CORNERS[h.corner][1];
      g = { type: 'resize', id: sel.id, corner: h.corner, sx, sy, w0: sel.w, h0: sel.h, rot: sel.rot,
            anchor: toWorld(sel, -sx * sel.w / 2, -sy * sel.h / 2) };
      canvasEl.style.cursor = resizeCursor(sel, h.corner);
    } else {
      const hit = hitItem(pt);
      if (!hit) { selectedId = null; canvasEl.style.cursor = 'default'; updateUI(); invalidate(); return; }
      selectedId = hit.id;
      raise(hit);
      g = { type: 'move', id: hit.id, startX: hit.x, startY: hit.y, px: pt.x, py: pt.y };
      canvasEl.style.cursor = 'move';
    }
    g.before = before;
    g.pointerId = e.pointerId;
    gesture = g;
    try { canvasEl.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
    updateUI();
    invalidate();
  }

  function onPointerMove(e) {
    if (!gesture) {
      if (e.pointerType !== 'touch') canvasEl.style.cursor = hoverCursor(pagePoint(e));
      return;
    }
    if (e.pointerId !== gesture.pointerId) return;
    const g = gesture, it = byId(g.id);
    if (!it) return;
    const pt = pagePoint(e);
    if (g.type === 'move') {
      it.x = clamp(g.startX + pt.x - g.px, 0, PAGE_W);
      it.y = clamp(g.startY + pt.y - g.py, 0, PAGE_H);
    } else if (g.type === 'rotate') {
      let rot = g.startRot + (Math.atan2(pt.y - it.y, pt.x - it.x) - g.startAngle);
      if (e.shiftKey) rot = Math.round(rot / SNAP) * SNAP;
      it.rot = wrapAngle(rot);
    } else {
      // corner resize: the opposite corner stays put, the aspect ratio is kept
      const dx = pt.x - g.anchor.x, dy = pt.y - g.anchor.y, c = Math.cos(g.rot), s = Math.sin(g.rot);
      const vx = dx * c + dy * s, vy = -dx * s + dy * c;
      let k = (vx * g.sx * g.w0 + vy * g.sy * g.h0) / (g.w0 * g.w0 + g.h0 * g.h0);
      k = clamp(k, MIN_SIZE / Math.min(g.w0, g.h0), MAX_SIZE / Math.max(g.w0, g.h0));
      it.w = g.w0 * k;
      it.h = g.h0 * k;
      const ctr = place(g.anchor.x, g.anchor.y, g.rot, g.sx * it.w / 2, g.sy * it.h / 2);
      it.x = clamp(ctr.x, 0, PAGE_W);
      it.y = clamp(ctr.y, 0, PAGE_H);
    }
    invalidate();
  }

  function onPointerEnd(e) {
    if (!gesture || e.pointerId !== gesture.pointerId) return;
    const g = gesture;
    gesture = null;
    try { canvasEl.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (!sameState(g.before, items)) pushHistory(g.before);
    if (e.pointerType !== 'touch') canvasEl.style.cursor = hoverCursor(pagePoint(e));
    updateUI();
    invalidate();
  }

  // ---- drawing ---------------------------------------------------------
  function drawItem(g, it) {
    g.push();
    g.translate(it.x, it.y);
    g.rotate(it.rot);
    g.imageMode(g.CENTER);
    g.image(it.img, 0, 0, it.w, it.h);
    g.pop();
  }

  function overhangs(it) {
    const cs = Math.abs(Math.cos(it.rot)), sn = Math.abs(Math.sin(it.rot));
    const hw = (it.w * cs + it.h * sn) / 2, hh = (it.w * sn + it.h * cs) / 2;
    return it.x - hw < 0 || it.x + hw > PAGE_W || it.y - hh < 0 || it.y + hh > PAGE_H;
  }

  function drawSelection(p, it) {
    const inv = 1 / view.s, hs = HANDLE * inv, off = ROT_OFFSET * inv;
    p.push();
    p.translate(it.x, it.y);
    p.rotate(it.rot);
    p.noFill();
    p.stroke(255, 210);
    p.strokeWeight(4 * inv);
    p.rect(-it.w / 2, -it.h / 2, it.w, it.h);
    p.stroke(cssVar('--accent'));
    p.strokeWeight(2 * inv);
    p.rect(-it.w / 2, -it.h / 2, it.w, it.h);
    p.line(0, -it.h / 2, 0, -it.h / 2 - off);
    p.fill(255);
    for (const [sx, sy] of CORNERS) p.rect(sx * it.w / 2 - hs / 2, sy * it.h / 2 - hs / 2, hs, hs, 2 * inv);
    p.circle(0, -it.h / 2 - off, hs * 1.25);
    p.pop();
  }

  function paint(p) {
    p.clear();
    const ctx = p.drawingContext, dpr = p.pixelDensity();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    p.push();
    p.translate(view.ox, view.oy);
    p.scale(view.s);

    // parts hanging off the sheet show faintly, so it is clear they will be cropped
    ctx.save();
    ctx.globalAlpha = 0.3;
    for (const it of items) if (overhangs(it)) drawItem(p, it);
    ctx.restore();

    // the sheet
    ctx.save();
    ctx.shadowColor = 'rgba(8, 28, 16, 0.30)';
    ctx.shadowBlur = 22 * dpr;
    ctx.shadowOffsetY = 6 * dpr;
    p.noStroke();
    p.fill(255);
    p.rect(0, 0, PAGE_W, PAGE_H);
    ctx.restore();

    // photos, cropped to the sheet exactly as the export will be
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, PAGE_W, PAGE_H);
    ctx.clip();
    for (const it of items) drawItem(p, it);
    ctx.restore();

    const sel = getSelected();
    if (sel) drawSelection(p, sel);
    p.pop();
  }

  // ---- layout ----------------------------------------------------------
  function layout() {
    const w = Math.max(1, els.box.clientWidth), h = Math.max(1, els.box.clientHeight);
    const pad = w < 560 ? 20 : 44;
    const s = Math.max(0.05, Math.min((w - pad * 2) / PAGE_W, (h - pad * 2) / PAGE_H));
    view = { s, ox: (w - PAGE_W * s) / 2, oy: (h - PAGE_H * s) / 2, w, h };

    const o = els.overlay.style;
    o.left = view.ox + 'px';
    o.top = view.oy + 'px';
    o.width = PAGE_W * s + 'px';
    o.height = PAGE_H * s + 'px';

    if (ready && (sketch.width !== w || sketch.height !== h)) sketch.resizeCanvas(w, h, true);
    invalidate();
  }

  // ---- export ----------------------------------------------------------
  function stamp() {
    const d = new Date(), z = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes());
  }

  let downloadsNS = null, downloadsSettled = false;
  const downloadsReady = (async () => {
    try { downloadsNS = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }
    catch (e) { downloadsNS = null; }
    downloadsSettled = true;
  })();

  function anchorDownload(blob, name) {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  async function exportPNG() {
    if (exporting || !items.length || !ready) return;
    exporting = true;
    els.dlLabel.textContent = 'Preparing…';
    updateUI();
    await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
    let blob = null;
    try {
      const W = Math.round(PAGE_W * EXPORT_SCALE), H = Math.round(PAGE_H * EXPORT_SCALE);
      const g = sketch.createGraphics(W, H);
      g.pixelDensity(1);
      g.background(255);
      g.drawingContext.imageSmoothingQuality = 'high';
      g.scale(EXPORT_SCALE);
      for (const it of items) drawItem(g, it);
      blob = await new Promise((resolve) => g.elt.toBlob(resolve, 'image/png'));
      g.remove();
    } catch (err) {
      blob = null;
    }
    if (!blob) {
      toast("The image couldn't be rendered. Try removing a few photos.");
    } else {
      const name = 'collage-' + stamp() + '.png';
      if (!downloadsSettled) await Promise.race([downloadsReady, new Promise((r) => setTimeout(r, 1500))]);
      if (downloadsNS) {
        try {
          await downloadsNS.save({ filename: name, data: blob });
          toast('Saved ' + name);
        } catch (err) {
          const code = err && err.code;
          if (code === 'declined') toast('Download canceled.');
          else if (code === 'rate_limited') toast('Wait a moment, then try again.');
          else toast("The file couldn't be saved here.");
        }
      } else {
        anchorDownload(blob, name);
        toast('Downloading ' + name);
      }
    }
    exporting = false;
    els.dlLabel.textContent = 'Download PNG';
    updateUI();
  }

  // ---- wiring ----------------------------------------------------------
  els.add.addEventListener('click', () => els.file.click());
  els.emptyAdd.addEventListener('click', () => els.file.click());
  els.file.addEventListener('change', () => {
    const picked = Array.from(els.file.files || []);
    els.file.value = '';
    if (picked.length) addFiles(picked);
  });
  els.undo.addEventListener('click', undo);
  els.redo.addEventListener('click', redo);
  els.del.addEventListener('click', deleteSelected);
  els.dl.addEventListener('click', exportPNG);

  window.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    const mod = e.metaKey || e.ctrlKey, key = (e.key || '').toLowerCase();
    if (mod && !e.altKey && key === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (mod && !e.altKey && key === 'y') { e.preventDefault(); redo(); }
    else if (!mod && (e.key === 'Delete' || e.key === 'Backspace')) {
      if (selectedId) { e.preventDefault(); deleteSelected(); }
    } else if (e.key === 'Escape') {
      if (selectedId && !gesture) { selectedId = null; updateUI(); invalidate(); }
    }
  });

  window.addEventListener('paste', (e) => {
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter((f) => f.type.startsWith('image/'));
    if (files.length) { e.preventDefault(); addFiles(files); }
  });

  let dragDepth = 0;
  const hasFiles = (e) => Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes('Files');
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; els.stage.classList.add('dragging'); });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', (e) => {
    if (!hasFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) els.stage.classList.remove('dragging');
  });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    els.stage.classList.remove('dragging');
    addFiles(e.dataTransfer.files);
  });

  // repaint when the theme changes (the selection color follows the theme)
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', invalidate);
  new MutationObserver(invalidate).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  new ResizeObserver(layout).observe(els.box);

  // ---- p5 sketch -------------------------------------------------------
  new p5((p) => {
    sketch = p;
    p.setup = () => {
      const cnv = p.createCanvas(Math.max(1, els.box.clientWidth), Math.max(1, els.box.clientHeight));
      canvasEl = cnv.elt;
      canvasEl.setAttribute('role', 'img');
      canvasEl.setAttribute('aria-label', 'Collage page, US Letter');
      canvasEl.addEventListener('pointerdown', onPointerDown);
      canvasEl.addEventListener('pointermove', onPointerMove);
      canvasEl.addEventListener('pointerup', onPointerEnd);
      canvasEl.addEventListener('pointercancel', onPointerEnd);
      p.noLoop();
      ready = true;
      layout();
    };
    p.draw = () => paint(p);
  }, els.box);

  updateUI();
  layout();
})();
</script>

</body></html>
