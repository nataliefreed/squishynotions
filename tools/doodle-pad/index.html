<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle Pad</title>
  <style>
    :root { color-scheme: light; --ink: #0f2e28; --mat: #2a6b5f; --marker: #ffdf3d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--mat); color: #f2f8f4; font: 1rem/1.5 system-ui, sans-serif; }
    main { width: min(62rem, 100% - 1.5rem); margin: 0 auto; padding: 1rem 0 2rem; }
    a { color: inherit; }
    h1 { margin: .25rem 0 1rem; font-size: 2rem; line-height: 1.1; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.25rem; margin-bottom: .75rem; }
    .swatches { display: flex; flex-wrap: wrap; gap: .4rem; }
    .swatch { width: 2.25rem; height: 2.25rem; border: 2px solid var(--ink); border-radius: 50%; background: var(--c); cursor: pointer; }
    .swatch[aria-pressed="true"] { outline: 3px solid var(--marker); outline-offset: 2px; }
    .size { display: flex; align-items: center; gap: .5rem; }
    .size input { width: 8rem; }
    .actions { display: flex; gap: .5rem; margin-left: auto; }
    button.action { padding: .55rem .9rem; border: 0; border-radius: 8px; background: #fbfbf8; color: var(--ink); font: 700 .95rem/1 system-ui, sans-serif; cursor: pointer; }
    button.action:disabled { opacity: .5; cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }

    canvas { display: block; width: 100%; height: auto; background: #fff; border-radius: 3px; cursor: crosshair; touch-action: none; }
  </style>
</head>
<body>
  <main>
    <a href="../../">All tools</a>
    <h1>Doodle Pad</h1>

    <div class="toolbar">
      <div id="swatches" class="swatches" role="group" aria-label="Color"></div>
      <label class="size">Brush size <input id="size" type="range" min="2" max="40" step="1"></label>
      <div class="actions">
        <button type="button" id="undo" class="action" disabled>Undo</button>
        <button type="button" id="clear" class="action">Clear</button>
        <button type="button" id="save" class="action">Save PNG</button>
      </div>
    </div>

    <canvas id="pad" width="960" height="640" aria-label="Drawing area"></canvas>
  </main>

  <script>
    // Every tool on this site shares one browser origin, so storage keys carry this tool's folder name.
    const store = {
      get(key, fallback = null) {
        try {
          const raw = localStorage.getItem('doodle-pad:' + key);
          return raw === null ? fallback : JSON.parse(raw);
        } catch { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem('doodle-pad:' + key, JSON.stringify(value)); }
        catch { /* storage is full or blocked; drawing still works */ }
      },
    };

    const COLORS = [
      ['Ink', '#0f2e28'], ['Red', '#e5484d'], ['Orange', '#f76b15'], ['Yellow', '#ffdf3d'],
      ['Green', '#30a46c'], ['Blue', '#0091ff'], ['Purple', '#8e4ec6'], ['Eraser', '#ffffff'],
    ];
    const PAPER = '#ffffff';
    const MAX_UNDO = 12;

    const canvas = document.getElementById('pad');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const swatches = document.getElementById('swatches');
    const sizeInput = document.getElementById('size');
    const undoButton = document.getElementById('undo');
    const { width: W, height: H } = canvas;

    let color = COLORS.some(([, c]) => c === store.get('color')) ? store.get('color') : COLORS[0][1];
    let size = Number(store.get('size', 8)) || 8;
    let last = null;
    let saveTimer = 0;
    const undoStack = [];

    function paintPaper() { ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H); }

    function saveSoon() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => store.set('drawing', canvas.toDataURL('image/png')), 300);
    }

    function rememberForUndo() {
      undoStack.push(ctx.getImageData(0, 0, W, H));
      if (undoStack.length > MAX_UNDO) undoStack.shift();
      undoButton.disabled = false;
    }

    function undo() {
      const previous = undoStack.pop();
      if (!previous) return;
      ctx.putImageData(previous, 0, 0);
      undoButton.disabled = undoStack.length === 0;
      saveSoon();
    }

    // Pointer coordinates are in CSS pixels; the canvas has its own fixed resolution.
    function pointFrom(e) {
      const rect = canvas.getBoundingClientRect();
      const pressure = e.pointerType === 'pen' && e.pressure > 0 ? e.pressure : 0.5;
      return { x: ((e.clientX - rect.left) * W) / rect.width, y: ((e.clientY - rect.top) * H) / rect.height, pressure, pen: e.pointerType === 'pen' };
    }

    function widthFor(p) { return p.pen ? size * (0.4 + p.pressure * 1.2) : size; }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      rememberForUndo();
      last = pointFrom(e);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(last.x, last.y, widthFor(last) / 2, 0, Math.PI * 2);
      ctx.fill();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!last) return;
      const next = pointFrom(e);
      ctx.strokeStyle = color;
      ctx.lineWidth = widthFor(next);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(next.x, next.y);
      ctx.stroke();
      last = next;
    });

    function endStroke() {
      if (!last) return;
      last = null;
      saveSoon();
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    for (const [name, value] of COLORS) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'swatch';
      button.style.setProperty('--c', value);
      button.title = name;
      button.setAttribute('aria-label', name);
      button.addEventListener('click', () => { color = value; store.set('color', value); syncSwatches(); });
      swatches.append(button);
    }
    function syncSwatches() {
      [...swatches.children].forEach((b, i) => b.setAttribute('aria-pressed', String(COLORS[i][1] === color)));
    }

    sizeInput.value = size;
    sizeInput.addEventListener('input', () => { size = Number(sizeInput.value); store.set('size', size); });

    undoButton.addEventListener('click', undo);
    document.getElementById('clear').addEventListener('click', () => { rememberForUndo(); paintPaper(); saveSoon(); });
    document.getElementById('save').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'doodle.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    });

    // Start with the last doodle if there is one.
    paintPaper();
    syncSwatches();
    const saved = store.get('drawing');
    if (saved) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, W, H);
      img.src = saved;
    }
  </script>
</body>
</html>
